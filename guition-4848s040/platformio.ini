; Guition ESP32-S3-4848S040 (4" 480x480, ST7701S RGB, GT911 Touch)
; ESP32-S3 N16R8: 16 MB Flash (QIO), 8 MB PSRAM (Octal)

[env:guition-4848s040]
; pioarduino = Community-Fork mit Arduino-Core 3.x. Bewusst auf 55.03.x festgelegt:
; Arduino-Core 4.0 (Plattform 61.x / "stable") ist mit Arduino_GFX 1.6.x noch nicht kompatibel.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Layouts liegen im Dateisystem (Ordner data/, hochladen mit: pio run -t uploadfs)
board_build.filesystem = littlefs

; USB-C geht über einen USB-Seriell-Chip (/dev/cu.usbserial-*)
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    moononournation/GFX Library for Arduino@~1.6.9
    lvgl/lvgl@~9.6.0
